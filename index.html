<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSCE Mock Papers</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: #f8f9fa;
      color: #1a1a2e;
    }

    /* --- STICKY HEADER --- */
    .top-wrapper {
      position: sticky;
      top: -120px;
      z-index: 100;
      background: #f8f9fa;
      padding: 16px 20px 4px 20px;
      transition: top 0.3s ease;
    }

    body.scrolled-top .top-wrapper {
      top: 0;
    }

    .top-card {
      background: white;
      border-radius: 20px;
      padding: 20px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #e8e8e8;
      max-width: 900px;
      margin: 0 auto 12px auto;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-box {
      background: #eef2ff;
      border-radius: 14px;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-box svg {
      width: 28px;
      height: 28px;
      color: #4a6cf7;
    }

    .header-text h2 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: -0.3px;
    }
    .header-text p {
      font-size: 14px;
      color: #6b7280;
      margin-top: 2px;
    }

    .search-card {
      background: white;
      border-radius: 20px;
      padding: 12px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #e8e8e8;
      max-width: 900px;
      margin: 0 auto;
      position: relative;
    }
    .search-card input {
      width: 100%;
      padding: 12px 18px 12px 46px;
      border-radius: 12px;
      border: 2px solid transparent;
      font-size: 15px;
      outline: none;
      transition: all 0.3s;
      background: transparent;
    }
    .search-card input:focus {
      border-color: #4a6cf7;
      box-shadow: 0 0 0 4px rgba(74, 108, 247, 0.1);
    }
    .search-icon {
      position: absolute;
      left: 32px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      width: 20px;
      height: 20px;
    }
    /* --- END STICKY HEADER --- */

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px 20px 20px;
    }

    .stats {
      color: #666;
      font-size: 14px;
      margin-bottom: 16px;
      padding: 0 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* --- LIST CARD LAYOUT --- */
    .card {
      background: white;
      border-radius: 16px;
      margin-bottom: 14px;
      padding: 16px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #e8e8e8;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
    }

    .list-icon-box {
      background: #f4f6ff;
      border-radius: 12px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .list-icon-box svg {
      width: 20px;
      height: 20px;
      color: #4a6cf7;
    }

    .list-content {
      flex: 1;
      min-width: 0;
    }

    .list-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .list-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #6b7280;
    }
    
    .list-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .list-meta svg {
      width: 14px;
      height: 14px;
      color: #9ca3af;
    }

    .badge-division {
      background: #eef2ff;
      color: #4a6cf7;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.3px;
      display: inline-block;
    }

    .chevron {
      color: #9ca3af;
      flex-shrink: 0;
      transition: transform 0.3s;
    }
    
    .card.active .chevron {
      transform: rotate(180deg);
    }

    .extra {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card.active .extra {
      max-height: 400px;
      opacity: 1;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #f0f0f0;
    }

    .metadata-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .metadata-item {
      background: #f8f9fa;
      padding: 10px 14px;
      border-radius: 10px;
    }

    .metadata-item .label {
      font-size: 11px;
      text-transform: uppercase;
      color: #888;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .metadata-item .value {
      font-size: 15px;
      font-weight: 500;
      color: #1a1a2e;
      margin-top: 2px;
    }

    .view-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #4a6cf7;
      color: white;
      padding: 10px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }

    .view-btn:hover {
      background: #3a5bd9;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(74, 108, 247, 0.3);
    }

    .view-btn svg {
      width: 18px;
      height: 18px;
    }

    /* --- PAGINATION STYLES --- */
    .pagination-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 20px 0 40px 0;
      flex-wrap: wrap;
    }
    
    .page-btn {
      background: white;
      border: 1px solid #e8e8e8;
      color: #1a1a2e;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    
    .page-btn:hover:not(:disabled) {
      background: #eef2ff;
      border-color: #4a6cf7;
    }
    
    .page-btn.active {
      background: #4a6cf7;
      color: white;
      border-color: #4a6cf7;
    }
    
    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    /* --- END PAGINATION STYLES --- */

    .skeleton {
      background: white;
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 12px;
      border: 1px solid #e8e8e8;
    }

    .skeleton-line {
      height: 16px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .skeleton-line.short {
      width: 60%;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }

    .empty p {
      font-size: 16px;
    }

    @media (max-width: 600px) {
      .header-text h2 { font-size: 18px; }
      .top-card { padding: 16px; }
      .search-card { padding: 10px 16px; }
      .list-title { font-size: 14px; }
      .list-meta { font-size: 12px; gap: 8px; }
      .list-icon-box { width: 38px; height: 38px; }
      .list-icon-box svg { width: 18px; height: 18px; }
      .container { padding: 0 16px 16px 16px; }
      .card { padding: 14px 16px; }
      .metadata-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .metadata-item { padding: 8px 12px; }
      .metadata-item .value { font-size: 13px; }
      .view-btn { padding: 8px 16px; font-size: 13px; }
      .page-btn { padding: 6px 10px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <!-- STICKY HEADER -->
  <div class="top-wrapper">
    <div class="top-card">
      <div class="header-row">
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div class="header-text">
          <h2>Mock Past Papers</h2>
          <p id="resourceCount">Loading resources...</p>
        </div>
      </div>
    </div>

    <div class="search-card">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Search Papers...">
    </div>
  </div>

  <div class="container">
    <div class="stats" id="stats">
      <span id="statsText">Loading...</span>
    </div>
    <div id="paperList">
      <div class="skeleton"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
      <div class="skeleton"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
      <div class="skeleton"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
    </div>
    
    <!-- Pagination Buttons -->
    <div class="pagination-container" id="paginationControls"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxZus2ljWkTrpcCI6zoNZUoG65v2KtxwLGgZdUe-mBKmm7Mq2FyZrORWHOvS8E3_472/exec";
    
    // Variables
    let allPapers = [];
    let filteredPapers = [];
    let openCard = null;
    let currentPage = 1;
    const ITEMS_PER_PAGE = 30;

    // DOM Elements
    const listEl = document.getElementById('paperList');
    const statsText = document.getElementById('statsText');
    const searchInput = document.getElementById('searchInput');
    const resourceCount = document.getElementById('resourceCount');
    const paginationControls = document.getElementById('paginationControls');

    // --- SCROLL LOGIC ---
    window.addEventListener('scroll', () => {
      if (window.scrollY === 0) {
        document.body.classList.add('scrolled-top');
      } else {
        document.body.classList.remove('scrolled-top');
      }
    });
    document.body.classList.add('scrolled-top');

    // --- PERSIST PAGE & SCROLL STATE ---
    // 1. Save page number AND scroll position when clicking "View PDF"
    function savePageState() {
      sessionStorage.setItem('mock_last_page', currentPage);
      sessionStorage.setItem('mock_search_query', searchInput.value);
      sessionStorage.setItem('mock_scroll_y', window.scrollY); // Save exact scroll pixel
    }

    // 2. Restore state when coming back from viewer
    function restorePageState() {
      const savedPage = sessionStorage.getItem('mock_last_page');
      const savedSearch = sessionStorage.getItem('mock_search_query');
      const savedScrollY = parseInt(sessionStorage.getItem('mock_scroll_y')) || 0;
      
      if (savedSearch) {
        searchInput.value = savedSearch;
        return { page: parseInt(savedPage) || 1, search: savedSearch, scrollY: savedScrollY };
      }
      
      return { page: parseInt(savedPage) || 1, search: null, scrollY: savedScrollY };
    }

    async function fetchPapers() {
      try {
        // Check if we already have the data cached in session (to avoid API reload on Back)
        const cachedData = sessionStorage.getItem('mock_papers_cache');
        let data;

        if (cachedData) {
          data = JSON.parse(cachedData);
        } else {
          const response = await fetch(API_URL);
          data = await response.json();
          if (data.success && data.papers) {
            sessionStorage.setItem('mock_papers_cache', JSON.stringify(data));
          }
        }
        
        if (data.success && data.papers) {
          allPapers = data.papers;
          resourceCount.textContent = `${allPapers.length} resources available`;
          
          // Initialize filteredPapers with ALL papers
          filteredPapers = [...allPapers];
          
          // Restore state if coming back from viewer
          const { page, search, scrollY } = restorePageState();
          
          if (search) {
            searchPapers(search, false); // false = don't save state again
          } else {
            renderPage(page);
          }

          // RESTORE SCROLL POSITION AFTER RENDER
          if (scrollY > 0) {
            // Wait slightly for the DOM to finish rendering the cards, then scroll
            requestAnimationFrame(() => {
              window.scrollTo({
                top: scrollY,
                behavior: 'instant' // Snap directly to position, no animation
              });
            });
          }

        } else {
          throw new Error('Invalid data format received from API');
        }
      } catch (error) {
        console.error('Error fetching papers:', error);
        resourceCount.textContent = 'Failed to load resources';
        listEl.innerHTML = `
          <div class="empty">
            <p>❌ Failed to load papers. Please try again later.</p>
            <p style="font-size:12px;margin-top:8px;color:#999;">${error.message}</p>
          </div>
        `;
      }
    }

    function renderPapersForPage(papersToRender) {
      if (!papersToRender || papersToRender.length === 0) {
        listEl.innerHTML = `
          <div class="empty">
            <p>📭 No papers found matching your search</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = '';
      openCard = null;

      papersToRender.forEach((paper) => {
        const card = document.createElement('div');
        card.className = 'card';

        const viewUrl = paper.view || '';
        const encodedUrl = encodeURIComponent(viewUrl);
        const fileSize = paper.size || 'Unknown';
        const viewTitle = encodeURIComponent(paper.title || 'Untitled');

        card.innerHTML = `
          <div class="card-header">
            <div class="list-icon-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
            </div>
            <div class="list-content">
              <div class="list-title">${paper.title || 'Untitled'}</div>
              <div class="list-meta">
                ${paper.division ? `<span class="badge-division">${paper.division}</span>` : ''}
                <span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                  ${paper.year || 'N/A'}
                </span>
                <span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line><line x1="10" y1="3" x2="8" y2="21"></line><line x1="16" y1="3" x2="14" y2="21"></line></svg>
                  ${paper.paper || 'N/A'}
                </span>
              </div>
            </div>
            <div class="chevron">▼</div>
          </div>
          <div class="extra">
            <div class="metadata-grid">
              <div class="metadata-item">
                <div class="label">Subject</div>
                <div class="value">${paper.subject || 'N/A'}</div>
              </div>
              <div class="metadata-item">
                <div class="label">Division</div>
                <div class="value">${paper.division || 'N/A'}</div>
              </div>
              <div class="metadata-item">
                <div class="label">Size</div>
                <div class="value">${fileSize}</div>
              </div>
            </div>
            <a href="viewer.html?pdf=${encodedUrl}&title=${viewTitle}" target="_blank" class="view-btn" onclick="savePageState()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              View PDF
            </a>
          </div>
        `;

        const header = card.querySelector('.card-header');
        header.addEventListener('click', () => {
          if (openCard && openCard !== card) {
            openCard.classList.remove('active');
          }
          card.classList.toggle('active');
          openCard = card.classList.contains('active') ? card : null;
        });

        listEl.appendChild(card);
      });
    }

    // --- PAGINATION LOGIC ---
    function renderPage(pageNumber) {
      currentPage = pageNumber;
      
      const totalResults = filteredPapers.length;
      const totalPages = Math.ceil(totalResults / ITEMS_PER_PAGE);
      
      const startIndex = (pageNumber - 1) * ITEMS_PER_PAGE;
      const endIndex = Math.min(startIndex + ITEMS_PER_PAGE, totalResults);
      
      const currentPapers = filteredPapers.slice(startIndex, endIndex);
      
      statsText.textContent = `Showing ${startIndex + 1}-${endIndex} of ${totalResults} paper${totalResults > 1 ? 's' : ''}`;
      
      renderPapersForPage(currentPapers);
      renderPagination(totalPages);
      
      sessionStorage.setItem('mock_last_page', currentPage);
    }

    function renderPagination(totalPages) {
      paginationControls.innerHTML = '';
      
      if (totalPages <= 1) {
        paginationControls.style.display = 'none';
        return;
      }
      paginationControls.style.display = 'flex';

      const prevBtn = document.createElement('button');
      prevBtn.className = 'page-btn';
      prevBtn.textContent = '‹';
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => renderPage(currentPage - 1);
      paginationControls.appendChild(prevBtn);

      let startPage = Math.max(1, currentPage - 2);
      let endPage = Math.min(totalPages, currentPage + 2);

      if (startPage > 1) {
        const firstBtn = document.createElement('button');
        firstBtn.className = 'page-btn';
        firstBtn.textContent = '1';
        firstBtn.onclick = () => renderPage(1);
        paginationControls.appendChild(firstBtn);
        if (startPage > 2) {
          const dots = document.createElement('span');
          dots.textContent = '…';
          dots.style.padding = '0 4px';
          paginationControls.appendChild(dots);
        }
      }

      for (let i = startPage; i <= endPage; i++) {
        const btn = document.createElement('button');
        btn.className = 'page-btn';
        if (i === currentPage) btn.classList.add('active');
        btn.textContent = i;
        btn.onclick = () => renderPage(i);
        paginationControls.appendChild(btn);
      }

      if (endPage < totalPages) {
        if (endPage < totalPages - 1) {
          const dots = document.createElement('span');
          dots.textContent = '…';
          dots.style.padding = '0 4px';
          paginationControls.appendChild(dots);
        }
        const lastBtn = document.createElement('button');
        lastBtn.className = 'page-btn';
        lastBtn.textContent = totalPages;
        lastBtn.onclick = () => renderPage(totalPages);
        paginationControls.appendChild(lastBtn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.className = 'page-btn';
      nextBtn.textContent = '›';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => renderPage(currentPage + 1);
      paginationControls.appendChild(nextBtn);
    }

    // --- SEARCH LOGIC ---
    function searchPapers(query, saveState = true) {
      const term = query.toLowerCase().trim();
      
      if (!term) {
        filteredPapers = [...allPapers];
      } else {
        filteredPapers = allPapers.filter(paper => {
          const title = (paper.title || '').toLowerCase();
          const subject = (paper.subject || '').toLowerCase();
          const year = (paper.year || '').toString();
          const paperNum = (paper.paper || '').toLowerCase();
          const division = (paper.division || '').toLowerCase();

          return title.includes(term) ||
                 subject.includes(term) ||
                 year.includes(term) ||
                 paperNum.includes(term) ||
                 division.includes(term);
        });
      }

      renderPage(1);
      
      if (saveState) {
        sessionStorage.setItem('mock_search_query', term);
      }
    }

    let searchTimeout;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        searchPapers(e.target.value);
      }, 300);
    });

    fetchPapers();
  </script>
</body>
</html>
