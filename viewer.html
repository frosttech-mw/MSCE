<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>PDF Viewer - Mock Past Papers</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: #f8f9fa;
      color: #1a1a2e;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- THEMED TOOLBAR --- */
    .top-wrapper {
      background: #f8f9fa;
      padding: 16px 20px 12px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      z-index: 10;
      flex-shrink: 0;
    }

    .top-card {
      background: white;
      border-radius: 20px;
      padding: 16px 24px;
      border: 1px solid #e8e8e8;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .left-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #6b7280;
      background: transparent;
      border: none;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.2s;
      padding: 6px 12px 6px 0;
      border-radius: 8px;
      font-family: inherit;
    }
    .back-btn:hover {
      color: #1a1a2e;
      background: #f8f9fa;
    }
    .back-btn svg {
      width: 20px;
      height: 20px;
    }

    .doc-icon-box {
      background: #eef2ff;
      border-radius: 12px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .doc-icon-box svg {
      width: 20px;
      height: 20px;
      color: #4a6cf7;
    }

    .doc-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a2e;
      max-width: 300px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .zoom-btn {
      background: #f0f2f5;
      border: 1px solid #e8e8e8;
      color: #1a1a2e;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      user-select: none;
    }

    .zoom-btn:hover {
      background: #eef2ff;
      border-color: #4a6cf7;
      color: #4a6cf7;
    }

    .zoom-level {
      font-size: 14px;
      font-weight: 600;
      color: #4b5563;
      min-width: 40px;
      text-align: center;
    }

    /* --- IFRAME CONTAINER --- */
    .iframe-container {
      flex: 1;
      background: #f0f2f5;
      padding: 20px;
      position: relative;
      overflow: auto; /* Important for zoom */
      display: flex;
      justify-content: center;
    }

    .pdf-wrapper {
      width: 100%;
      max-width: 1100px;
      height: 100%;
      transition: transform 0.2s ease;
      transform-origin: top center;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      min-height: 100%;
    }

    /* --- STATES --- */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #6b7280;
    }

    .loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e5e7eb;
      border-top-color: #4a6cf7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #ef4444;
      text-align: center;
      padding: 20px;
    }

    .error svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
    }

    .view-in-browser-btn {
      margin-top: 16px;
      padding: 10px 24px;
      background: #4a6cf7;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
      text-decoration: none;
      display: inline-block;
      font-family: inherit;
    }

    .view-in-browser-btn:hover {
      background: #3a5bd9;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 600px) {
      .top-wrapper { padding: 12px 16px 8px 16px; }
      .top-card { padding: 12px 16px; flex-direction: column; align-items: stretch; }
      .left-header { width: 100%; }
      .doc-title { max-width: 150px; font-size: 14px; }
      .toolbar-right { width: 100%; justify-content: flex-end; }
      .iframe-container { padding: 12px; }
    }
  </style>
</head>
<body>

  <!-- THEMED TOOLBAR -->
  <div class="top-wrapper">
    <div class="top-card">
      <div class="left-header">
        <button class="back-btn" onclick="goBack()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Back
        </button>
        <div class="doc-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
        </div>
        <span class="doc-title" id="pdfTitle">PDF Viewer</span>
      </div>
      <div class="toolbar-right">
        <button class="zoom-btn" onclick="changeZoom(-0.1)">−</button>
        <span class="zoom-level" id="zoomDisplay">100%</span>
        <button class="zoom-btn" onclick="changeZoom(0.1)">+</button>
      </div>
    </div>
  </div>

  <!-- PDF CONTAINER -->
  <div class="iframe-container" id="pdfContainer">
    <div class="loading" id="loadingState">
      <div class="spinner"></div>
      <p>Loading PDF...</p>
    </div>
  </div>

  <script>
    let pdfUrl = '';
    let fileId = '';
    let currentZoom = 1.0; // 100%

    // Get URL parameter
    function getParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    // Extract file ID from Google Drive URL
    function extractFileId(url) {
      if (!url) return null;
      
      const match1 = url.match(/\/file\/d\/([^\/]+)/);
      if (match1) return match1[1];
      
      const match2 = url.match(/[?&]id=([^&]+)/);
      if (match2) return match2[1];
      
      return null;
    }

    // ZOOM FUNCTIONS
    function changeZoom(delta) {
      currentZoom = Math.min(Math.max(0.5, currentZoom + delta), 2.0); // Min 50%, Max 200%
      const zoomPercent = Math.round(currentZoom * 100);
      document.getElementById('zoomDisplay').textContent = zoomPercent + '%';
      
      const wrapper = document.querySelector('.pdf-wrapper');
      if (wrapper) {
        wrapper.style.transform = `scale(${currentZoom})`;
      }
    }

    // Load PDF in iframe
    function loadPDF() {
      const encodedUrl = getParam('pdf');
      if (!encodedUrl) {
        showError('No PDF URL provided');
        return;
      }

      try {
        pdfUrl = decodeURIComponent(encodedUrl);
        fileId = extractFileId(pdfUrl);
        
        let embedUrl = pdfUrl;
        
        if (fileId) {
          embedUrl = `https://drive.google.com/file/d/${fileId}/preview?rm=minimal&widget=true`;
        } else {
          if (pdfUrl.includes('?')) {
            embedUrl = pdfUrl + '&rm=minimal&widget=true';
          } else {
            embedUrl = pdfUrl + '?rm=minimal&widget=true';
          }
        }

        document.getElementById('pdfTitle').textContent = 'Loading PDF...';

        // Create iframe wrapper for zooming
        const wrapper = document.createElement('div');
        wrapper.className = 'pdf-wrapper';

        // Create iframe
        const iframe = document.createElement('iframe');
        iframe.src = embedUrl;
        iframe.allow = 'autoplay';
        iframe.allowFullscreen = true;
        iframe.onload = function() {
          document.getElementById('loadingState').style.display = 'none';
          document.getElementById('pdfTitle').textContent = 'PDF Viewer';
        };
        iframe.onerror = function() {
          showErrorWithFallback(
            'Failed to load PDF.',
            'Try opening it directly in your browser instead.',
            pdfUrl
          );
        };

        // Clear loading state, add wrapper, add iframe to wrapper
        const container = document.getElementById('pdfContainer');
        container.innerHTML = '';
        wrapper.appendChild(iframe);
        container.appendChild(wrapper);

        // Reset zoom to 100% on new load
        currentZoom = 1.0;
        document.getElementById('zoomDisplay').textContent = '100%';
        wrapper.style.transform = 'scale(1)';

        // Hide loading after 5 seconds
        setTimeout(() => {
          const loading = document.getElementById('loadingState');
          if (loading) loading.style.display = 'none';
        }, 5000);

      } catch (error) {
        console.error('Error loading PDF:', error);
        showErrorWithFallback(
          'Failed to load PDF.',
          'Try opening it directly in your browser instead.',
          pdfUrl
        );
      }
    }

    // Show error
    function showError(message) {
      const container = document.getElementById('pdfContainer');
      container.innerHTML = `
        <div class="error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <p>${message}</p>
          <button onclick="goBack()" class="view-in-browser-btn">Go Back</button>
        </div>
      `;
    }

    // Show error with fallback
    function showErrorWithFallback(message, suggestion, url) {
      const container = document.getElementById('pdfContainer');
      container.innerHTML = `
        <div class="error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <p><strong>${message}</strong></p>
          <p style="font-size:14px;color:#6b7280;margin:8px 0;">${suggestion}</p>
          <div style="display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;justify-content:center;">
            <a href="${url}" target="_blank" class="view-in-browser-btn" style="background:#ffd93d;color:#1a1a2e;">Open in Browser</a>
            <button onclick="goBack()" class="view-in-browser-btn" style="background:#4a6cf7;">Go Back</button>
          </div>
        </div>
      `;
    }

    // Go back
    function goBack() {
      window.history.back();
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        goBack();
      }
    });

    // Initialize
    loadPDF();
  </script>
</body>
</html>
